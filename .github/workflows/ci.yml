name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Install real language server
        run: npm install --prefix "$RUNNER_TEMP/lsp" --no-package-lock --ignore-scripts typescript-language-server@5.2.0 typescript@5.9.3
      - name: Verify
        env:
          PI_LSP_REAL_SERVER: ${{ runner.temp }}/lsp/node_modules/.bin/typescript-language-server
        run: |
          "$PI_LSP_REAL_SERVER" --version
          npm run verify

